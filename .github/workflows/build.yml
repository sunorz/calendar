name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.1"

      - name: Set Default APK Path
        run: |
          echo "APK_PATH=${{ steps.sign_app.outputs.signedReleaseFile }}" >> $GITHUB_ENV
          
      - name: Rename APK for Push/Dispatch
        if: github.event_name != 'release'
        run: |
          TIMESTAMP=$(date +%s)
          APK_NAME="calendar-beta-${TIMESTAMP}.apk"
          mv "${{ steps.sign_app.outputs.signedReleaseFile }}" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Rename APK for Release
        if: github.event_name == 'release'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          SAFE_REF=$(echo "$TAG_NAME" | tr '/' '-')
          APK_NAME="calendar-${SAFE_REF}-release.apk"
          mv "${{ steps.sign_app.outputs.signedReleaseFile }}" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
          
      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
