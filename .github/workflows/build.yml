name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. 如果是点击发布 Release，全面搜寻最新生成的 Beta APK（包括从已有 Releases 和 GitHub Actions Artifacts）
      - name: Check and Fast-Promote Latest Beta APK for Release
        if: github.event_name == 'release'
        id: check_beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_dist
          CURRENT_TAG="${{ github.event.release.tag_name }}"
          SAFE_REF=$(echo "$CURRENT_TAG" | tr '/' '-')
          TARGET_APK="release_dist/calendar-${SAFE_REF}-release.apk"

          echo "Current release tag: $CURRENT_TAG"
          echo "Searching for the latest Beta APK across Releases and Workflow Artifacts..."

          # 1. 尝试从历史 Releases 中下载所有 calendar-beta*.apk
          RELEASES=$(gh release list --limit 20 --json tagName --jq '.[].tagName' 2>/dev/null || echo "")
          for TAG in $RELEASES; do
            if [ "$TAG" != "$CURRENT_TAG" ]; then
              gh release download "$TAG" --pattern "calendar-beta*.apk" --dir release_dist 2>/dev/null || true
            fi
          done

          # 2. 尝试从最近成功的 Workflow Runs 中检索最新的 app-release Artifacts
          RUN_IDS=$(gh run list --status success --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null || echo "")
          for R_ID in $RUN_IDS; do
            gh run download "$R_ID" --name app-release --dir "release_dist/run_${R_ID}" 2>/dev/null || true
          done

          # 3. 收集所有找到的 Beta APK，按时间戳/版本升序后取最后一个（最新）
          LATEST_BETA=$(find release_dist -type f -name "calendar-beta*.apk" | sort -V | tail -n 1)

          if [ -n "$LATEST_BETA" ] && [ -f "$LATEST_BETA" ]; then
            echo "Found latest Beta APK: $LATEST_BETA"
            cp "$LATEST_BETA" "$TARGET_APK"
            echo "FOUND_BETA=true" >> $GITHUB_OUTPUT
            echo "APK_PATH=${TARGET_APK}" >> $GITHUB_ENV
            echo "Successfully promoted latest Beta APK to release!"
            exit 0
          fi

          echo "No Beta APK found across releases or artifacts. Falling back to full Gradle compilation..."
          echo "FOUND_BETA=false" >> $GITHUB_OUTPUT

      # 2. 只有当没有找到 Beta 包（或普通 Push/Dispatch）时，才执行耗时的 JDK/Gradle 编译构建流程
      - name: Set up JDK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore debug keystore
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: chmod +x gradlew

      - name: Build Release APK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: ./gradlew assembleRelease

      - name: Sign APK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.1"
          
      - name: Rename APK for Push/Dispatch
        if: github.event_name != 'release'
        run: |
          TIMESTAMP=$(date +%s)
          APK_NAME="calendar-beta-${TIMESTAMP}.apk"
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          mv "$SIGNED_FILE" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Rename APK for Release (Fallback Build)
        if: github.event_name == 'release' && steps.check_beta.outputs.FOUND_BETA != 'true'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          SAFE_REF=$(echo "$TAG_NAME" | tr '/' '-')
          APK_NAME="calendar-${SAFE_REF}-release.apk"
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          mv "$SIGNED_FILE" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Get Latest Release Tag (on Push)
        if: github.event_name != 'release'
        id: get_latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
          
      - name: Attach APK to Current Published Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Beta APK to Latest Existing Release (on Push)
        if: github.event_name != 'release' && steps.get_latest_release.outputs.LATEST_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ steps.get_latest_release.outputs.LATEST_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
