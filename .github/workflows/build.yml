name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      # 1. 如果是点击发布 Release，优先获取最新成功构建的 Beta APK
      - name: Check and Fast-Promote Latest Beta APK for Release
        if: github.event_name == 'release'
        id: check_beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_dist
          CURRENT_TAG="${{ github.event.release.tag_name }}"
          SAFE_REF=$(echo "$CURRENT_TAG" | tr '/' '-')
          TARGET_APK="release_dist/calendar-${SAFE_REF}-release.apk"

          echo "Current release tag: $CURRENT_TAG"
          echo "Locating the newest Beta APK..."

          # 1. 优先从最近一次成功的 Push 或 Manual Dispatch 工作流中下载最新打包的 Beta APK
          LATEST_RUN_ID=$(gh run list --status success --limit 15 --json databaseId,event --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | .[0].databaseId // empty')

          if [ -n "$LATEST_RUN_ID" ]; then
            echo "Found most recent successful run ID: $LATEST_RUN_ID"
            gh run download "$LATEST_RUN_ID" --name app-release --dir release_dist 2>/dev/null || true
          fi

          # 2. 若 Artifact 已过期，则尝试从最新上一个已发布的 Release 中获取
          if [ -z "$(find release_dist -type f -name "*.apk" 2>/dev/null)" ]; then
            echo "No artifact found, checking latest previous release..."
            PREV_TAG=$(gh release list --limit 5 --json tagName --jq "[.[] | select(.tagName != \"$CURRENT_TAG\")] | .[0].tagName // empty")
            if [ -n "$PREV_TAG" ]; then
              echo "Downloading from release: $PREV_TAG"
              gh release download "$PREV_TAG" --pattern "calendar-beta*.apk" --dir release_dist 2>/dev/null || true
            fi
          fi

          # 3. 精准按时间戳数值提取最新（数值最大）的 Beta APK，彻底杜绝路径名排序或旧版本干扰
          LATEST_BETA=$(find release_dist -type f -name "*.apk" | while read -r f; do
            fname=$(basename "$f")
            ts=$(echo "$fname" | grep -o -E '[0-9]{9,12}' | head -n 1)
            echo "${ts:-0} $f"
          done | sort -n | tail -n 1 | awk '{print $2}')

          if [ -n "$LATEST_BETA" ] && [ -f "$LATEST_BETA" ]; then
            echo "Successfully identified newest Beta APK: $LATEST_BETA"
            cp "$LATEST_BETA" "$TARGET_APK"
            echo "FOUND_BETA=true" >> $GITHUB_OUTPUT
            echo "APK_PATH=${TARGET_APK}" >> $GITHUB_ENV
            echo "Promotion ready!"
            exit 0
          fi

          echo "No suitable Beta APK found. Falling back to full Gradle compilation..."
          echo "FOUND_BETA=false" >> $GITHUB_OUTPUT

      # 2. 只有当没有找到 Beta 包（或普通 Push/Dispatch）时，才执行耗时的 JDK/Gradle 编译构建流程
      - name: Set up JDK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore debug keystore
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: chmod +x gradlew

      - name: Build Release APK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: |
          GIT_HASH=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "${GITHUB_SHA::7}")
          echo "Building Release APK with GIT_HASH=${GIT_HASH}"
          ./gradlew assembleRelease -PGIT_HASH="${GIT_HASH}"

      - name: Sign APK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.1"
          
      - name: Rename APK for Push/Dispatch
        if: github.event_name != 'release'
        run: |
          TIMESTAMP=$(date +%s)
          APK_NAME="calendar-beta-${TIMESTAMP}.apk"
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          mv "$SIGNED_FILE" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Rename APK for Release (Fallback Build)
        if: github.event_name == 'release' && steps.check_beta.outputs.FOUND_BETA != 'true'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          SAFE_REF=$(echo "$TAG_NAME" | tr '/' '-')
          APK_NAME="calendar-${SAFE_REF}-release.apk"
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          mv "$SIGNED_FILE" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Get Latest Release Tag (on Push)
        if: github.event_name != 'release'
        id: get_latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
          
      - name: Attach APK to Current Published Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Beta APK to Latest Existing Release (on Push)
        if: github.event_name != 'release' && steps.get_latest_release.outputs.LATEST_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ steps.get_latest_release.outputs.LATEST_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
