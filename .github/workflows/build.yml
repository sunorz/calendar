name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. 如果是点击发布 Release，先尝试从上一版 Release 中寻找 Beta APK 直接复用（秒级完成）
      - name: Check and Fast-Promote Beta APK for Release
        if: github.event_name == 'release'
        id: check_beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_dist
          CURRENT_TAG="${{ github.event.release.tag_name }}"
          SAFE_REF=$(echo "$CURRENT_TAG" | tr '/' '-')
          TARGET_APK="release_dist/calendar-${SAFE_REF}-release.apk"

          echo "Current creating release tag: $CURRENT_TAG"
          echo "Finding previous releases (excluding current tag $CURRENT_TAG)..."

          # 列出所有已发布的 release tag，排除掉当前刚刚新建的 tag，取上一版的 tag
          PREV_TAG=$(gh release list --limit 10 --json tagName --jq "[.[] | select(.tagName != \"$CURRENT_TAG\")] | .[0].tagName // empty")

          if [ -n "$PREV_TAG" ]; then
            echo "Found previous release tag: $PREV_TAG"
            echo "Checking if $PREV_TAG contains a Beta APK..."
            
            # 从上一版 release 中下载最新的 calendar-beta-*.apk
            if gh release download "$PREV_TAG" --pattern "calendar-beta*.apk" --dir release_dist 2>/dev/null; then
              DOWNLOADED_BETA=$(ls release_dist/calendar-beta*.apk 2>/dev/null | head -n 1 || echo "")
              if [ -n "$DOWNLOADED_BETA" ] && [ -f "$DOWNLOADED_BETA" ]; then
                echo "Successfully downloaded Beta APK from previous release ($PREV_TAG): $DOWNLOADED_BETA"
                mv "$DOWNLOADED_BETA" "$TARGET_APK"
                
                echo "FOUND_BETA=true" >> $GITHUB_OUTPUT
                echo "APK_PATH=${TARGET_APK}" >> $GITHUB_ENV
                echo "Fast promotion ready!"
                exit 0
              fi
            fi
          fi
          
          echo "No Beta APK found in previous release or download failed. Falling back to full Gradle compilation..."
          echo "FOUND_BETA=false" >> $GITHUB_OUTPUT

      # 2. 只有当没有找到 Beta 包（或普通 Push/Dispatch）时，才执行耗时的 JDK/Gradle 编译构建流程
      - name: Set up JDK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore debug keystore
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: chmod +x gradlew

      - name: Build Release APK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        run: ./gradlew assembleRelease

      - name: Sign APK
        if: github.event_name != 'release' || steps.check_beta.outputs.FOUND_BETA != 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.1"
          
      - name: Rename APK for Push/Dispatch
        if: github.event_name != 'release'
        run: |
          TIMESTAMP=$(date +%s)
          APK_NAME="calendar-beta-${TIMESTAMP}.apk"
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          mv "$SIGNED_FILE" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Rename APK for Release (Fallback Build)
        if: github.event_name == 'release' && steps.check_beta.outputs.FOUND_BETA != 'true'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          SAFE_REF=$(echo "$TAG_NAME" | tr '/' '-')
          APK_NAME="calendar-${SAFE_REF}-release.apk"
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          mv "$SIGNED_FILE" "app/build/outputs/apk/release/${APK_NAME}"
          echo "APK_PATH=app/build/outputs/apk/release/${APK_NAME}" >> $GITHUB_ENV

      - name: Get Latest Release Tag (on Push)
        if: github.event_name != 'release'
        id: get_latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
          
      - name: Attach APK to Current Published Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Beta APK to Latest Existing Release (on Push)
        if: github.event_name != 'release' && steps.get_latest_release.outputs.LATEST_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: ${{ steps.get_latest_release.outputs.LATEST_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
